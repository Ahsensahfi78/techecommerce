services:
  - type: web
    name: techmos-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        value: sqlite:///./ecommerce.db
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: techmos-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.8.0
      - key: NEXT_PUBLIC_API_URL
        value: https://techmos-api.onrender.com
